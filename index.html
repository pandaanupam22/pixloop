<!DOCTYPE html>
<html>
<head>
  <title>PixLoop</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #222;
      font-weight: bold;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 1px;
    }

    .profile {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 10px;
    }

    .post {
      background: #111;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
    }

    .post img {
      width: 100%;
    }

    .caption {
      padding: 10px;
      font-size: 14px;
      color: #ccc;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">📷 PixLoop</div>
  <div class="profile">👤</div>
</header>

<div class="container">

  <div class="post">
    <img src="https://picsum.photos/500/400?random=1">
    <div class="caption">First PixLoop post 🚀</div>
  </div>

  <div class="post">
    <img src="https://picsum.photos/500/400?random=2">
    <div class="caption">Now with profile icon 😎</div>
  </div>

</div>

<footer>Made with ❤️ by Anupam</footer>

</body>
</html>
