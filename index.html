<!DOCTYPE html>
<html>
<head>
  <title>PixLoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: -apple-system, Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #222;
      font-weight: bold;
      font-size: 20px;
    }

    .logo {
      letter-spacing: 1px;
    }

    .icons span {
      margin-left: 15px;
      font-size: 18px;
      cursor: pointer;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding-bottom: 70px;
    }

    .post {
      background: #111;
      margin: 15px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(255,255,255,0.05);
    }

    .post img {
      width: 100%;
      display: block;
    }

    .actions {
      padding: 10px 12px;
      font-size: 18px;
    }

    .actions span {
      margin-right: 15px;
      cursor: pointer;
    }

    .caption {
      padding: 0 12px 12px;
      font-size: 14px;
      color: #ccc;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      font-size: 20px;
    }

    .navbar span {
      opacity: 0.8;
    }

    .navbar span:hover {
      opacity: 1;
    }

  </style>
</head>
<body>

<header>
  <div class="logo">✨ PixLoop</div>
  <div class="icons">
    <span>➕</span>
    <span>💬</span>
    <span>👤</span>
  </div>
</header>

<div class="container">

  <div class="post">
    <img src="https://picsum.photos/500/400?random=1">
    <div class="actions">
      <span>❤️</span>
      <span>💬</span>
      <span>📤</span>
      <span style="float:right;">🔖</span>
    </div>
    <div class="caption">
      <b>@anupam</b> First PixLoop post 🚀
    </div>
  </div>

  <div class="post">
    <img src="https://picsum.photos/500/400?random=2">
    <div class="actions">
      <span>❤️</span>
      <span>💬</span>
      <span>📤</span>
      <span style="float:right;">🔖</span>
    </div>
    <div class="caption">
      <b>@pixloop</b> Clean dark UI looks premium 😎
    </div>
  </div>

</div>

<div class="navbar">
  <span>🏠</span>
  <span>🔍</span>
  <span>➕</span>
  <span>🎬</span>
  <span>👤</span>
</div>

</body>
</html>
<header>
  📷 PixLoop
  <div class="profile">👤</div>
</header>

<div class="container">

  <div class="post">
    <img src="https://picsum.photos/500/400?random=1">
    <div class="like-btn" onclick="like(this)">❤️ Like</div>
    <div class="caption">First PixLoop post 🚀</div>
  </div>

  <div class="post">
    <img src="https://picsum.photos/500/400?random=2">
    <div class="like-btn" onclick="like(this)">❤️ Like</div>
    <div class="caption">Testing my social site 😎</div>
  </div>

</div>

<div class="navbar">
  🏠
  🔍
  ➕
  👤
</div>

<script>
  function like(btn) {
    btn.classList.toggle("liked");
  }
</script>

</body>
</html>
