<!DOCTYPE html>
<html>
<head>
  <title>PixLoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #222;
      font-weight: bold;
      font-size: 20px;
    }

    .profile {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding-bottom: 60px;
    }

    .post {
      background: #111;
      margin: 15px;
      border-radius: 10px;
      overflow: hidden;
    }

    .post img {
      width: 100%;
    }

    .caption {
      padding: 10px;
      font-size: 14px;
      color: #ccc;
    }

    .like-btn {
      padding: 10px;
      cursor: pointer;
      color: white;
    }

    .like-btn.liked {
      color: red;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      font-size: 18px;
    }

  </style>
</head>
<body>

<header>
  📷 PixLoop
  <div class="profile">👤</div>
</header>

<div class="container">

  <div class="post">
    <img src="https://picsum.photos/500/400?random=1">
    <div class="like-btn" onclick="like(this)">❤️ Like</div>
    <div class="caption">First PixLoop post 🚀</div>
  </div>

  <div class="post">
    <img src="https://picsum.photos/500/400?random=2">
    <div class="like-btn" onclick="like(this)">❤️ Like</div>
    <div class="caption">Testing my social site 😎</div>
  </div>

</div>

<div class="navbar">
  🏠
  🔍
  ➕
  👤
</div>

<script>
  function like(btn) {
    btn.classList.toggle("liked");
  }
</script>

</body>
</html>
