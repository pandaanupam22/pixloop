<!DOCTYPE html>
<html>
<head>
  <title>PixLoop</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #222;
      letter-spacing: 1px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 10px;
    }

    .post {
      background: #111;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255,255,255,0.05);
    }

    .post img {
      width: 100%;
      display: block;
    }

    .caption {
      padding: 10px;
      font-size: 14px;
      color: #ccc;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>

<header>📸 PixLoop</header>

<div class="container">

  <div class="post">
    <img src="https://picsum.photos/500/400?random=1">
    <div class="caption">First PixLoop post 🚀</div>
  </div>

  <div class="post">
    <img src="https://picsum.photos/500/400?random=2">
    <div class="caption">Black theme looks clean 😎</div>
  </div>

  <div class="post">
    <img src="https://picsum.photos/500/400?random=3">
    <div class="caption">My first social website 💪</div>
  </div>

</div>

<footer>Made with ❤️ by Anupam</footer>

</body>
</html>
